spring.application.name=order-service
server.port=${SERVER_PORT:8083}

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/order_service_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Inter-service URLs
food.service.url=${FOOD_SERVICE_URL:http://food-service:8082}
user.service.url=${USER_SERVICE_URL:http://user-service:8081}
services:
  rabbitmq:
    image: rabbitmq:4.2.5-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - movienet

  postgres:
    image: postgres:18.1-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - movienet

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - user-service
      - movie-service
      - booking-service
    environment:
      - USER_SERVICE_URL=http://user-service:8001
      - MOVIE_SERVICE_URL=http://movie-service:8002
      - BOOKING_SERVICE_URL=http://booking-service:8003
    env_file: ./api-gateway/.env
    volumes:
      - ./api-gateway:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && npm run dev"
    networks:
      - movienet

  user-service:
    build: ./user-service
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - rabbitmq
    env_file: ./user-service/.env
    volumes:
      - ./user-service:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && npx prisma db push --force-reset --accept-data-loss && npx prisma db seed && npm run dev"
    networks:
      - movienet

  movie-service:
    build: ./movie-service
    ports:
      - "8002:8002"
    depends_on:
      - postgres
      - rabbitmq
    env_file: ./movie-service/.env
    volumes:
      - ./movie-service:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && npx prisma db push --force-reset --accept-data-loss && npx prisma db seed && npm run dev"
    networks:
      - movienet

  booking-service:
    build: ./booking-service
    ports:
      - "8003:8003"
    depends_on:
      - postgres
      - rabbitmq
    env_file: ./booking-service/.env
    volumes:
      - ./booking-service:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && npx prisma db push --force-reset --accept-data-loss && npm run dev"
    networks:
      - movienet

  payment-notification-service:
    build: ./payment-notification-service
    ports:
      - "8004:8004"
    depends_on:
      - rabbitmq
    env_file: ./payment-notification-service/.env
    volumes:
      - ./payment-notification-service:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && npm run dev"
    networks:
      - movienet

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - movienet

networks:
  movienet:
    driver: bridge

volumes:
  postgres_data:
